<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Shaytye Dashboard</title>
<link rel="icon" type="image/png" href="/favicon.png">
<style>
:root{--ink:#221B1F;--ink2:#7A6C73;--rose:#F2C7D5;--rose-d:#D9899F;--rose-l:#FBEAF0;--gold:#D6B285;
--cream:#FFFFFF;--cream2:#FBF6F2;--line:#F0E2E8;--ok:#4FA37A;--warn:#C98A2E;--bad:#C25B5B;
--shadow:0 12px 34px rgba(205,135,165,.12);--r:16px}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;overflow-x:clip}
body{font-family:'Outfit','Segoe UI',system-ui,sans-serif;background:linear-gradient(172deg,#FDF2F6 0%,#FAF2EA 60%,#F8EEE1 100%);color:var(--ink);line-height:1.55;min-height:100vh;overflow-x:clip}
button{font-family:inherit;cursor:pointer}
a{color:var(--rose-d)}
.hide{display:none!important}

/* ---- login ---- */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:var(--cream);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.login-box{width:100%;max-width:400px;padding:36px 32px;text-align:center}
.login-box img{height:60px;margin-bottom:8px}
.login-box h1{font-family:'Fraunces',serif;font-weight:600;font-size:22px;margin-bottom:4px}
.login-box p{color:var(--ink2);font-size:14px;margin-bottom:22px}
.field{text-align:left;margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--ink2);margin-bottom:6px;letter-spacing:.02em}
input,select,textarea{width:100%;font-family:inherit;font-size:15px;color:var(--ink);background:var(--cream);
border:1px solid var(--line);border-radius:11px;padding:11px 13px;outline:none;transition:border-color .2s}
input:focus,select:focus,textarea:focus{border-color:var(--rose-d)}
textarea{resize:vertical;min-height:70px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;
background:var(--rose-d);color:#fff;font-weight:600;font-size:15px;padding:12px 22px;width:100%;transition:transform .15s,box-shadow .2s}
.btn:hover{transform:translateY(-1px);box-shadow:0 10px 24px rgba(205,135,165,.32)}
.btn:disabled{opacity:.55;cursor:default;transform:none;box-shadow:none}
.btn.ghost{background:transparent;color:var(--rose-d);border:1px solid var(--line)}
.btn.sm{width:auto;padding:8px 16px;font-size:13px}
.btn.tiny{width:auto;padding:5px 11px;font-size:12px}
.btn.danger{background:var(--bad)}
.btn.gray{background:#EDE4E8;color:var(--ink)}
.msg{font-size:13px;margin-top:12px;min-height:18px}
.msg.err{color:var(--bad)}.msg.ok{color:var(--ok)}

/* ---- shell ---- */
#app{display:flex;min-height:100vh}
.side{width:230px;flex-shrink:0;background:var(--cream);border-right:1px solid var(--line);
display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.side .brand{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.side .brand img{height:72px;width:auto;max-width:100%;object-fit:contain}
.side .brand b{font-family:'Fraunces',serif;font-weight:600;font-size:18px}
.nav{flex:1;padding:14px 12px;display:flex;flex-direction:column;gap:3px;overflow-y:auto}
.nav button{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:transparent;border:0;
border-radius:11px;padding:11px 13px;color:var(--ink2);font-size:14.5px;font-weight:500;transition:background .15s,color .15s}
.nav button:hover{background:var(--cream2)}
.nav button.on{background:var(--rose-l);color:var(--rose-d);font-weight:600}
.nav button .ic{width:18px;text-align:center;font-size:15px}
.nav .badge{margin-left:auto;background:var(--rose-d);color:#fff;font-size:11px;font-weight:700;border-radius:99px;padding:1px 7px}
.side .foot{padding:14px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--ink2)}
.side .foot button{background:none;border:0;color:var(--rose-d);font-size:12px;font-weight:600;padding:0;margin-top:4px}

.main{flex:1;min-width:0;padding:26px 30px 60px}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;gap:12px;flex-wrap:wrap}
.topbar h2{font-family:'Fraunces',serif;font-weight:600;font-size:24px}
.topbar .sub{color:var(--ink2);font-size:13px}

/* ---- stat cards ---- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(176px,1fr));gap:14px;margin-bottom:26px}
.stat{background:var(--cream);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);min-width:0}
.stat .n{font-family:'Fraunces',serif;font-size:28px;font-weight:600;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .n.money{font-size:clamp(17px,1.6vw,23px);letter-spacing:-.015em}
.stat .l{font-size:12.5px;color:var(--ink2);margin-top:3px}
.stat .d{font-size:11.5px;font-weight:700;margin-top:7px;display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:99px}
.stat .d.up{color:#2E7D5B;background:#E6F4EC}
.stat .d.dn{color:#B23B4E;background:#FBE9EC}
.stat .d.flat{color:var(--ink2);background:var(--cream2)}
.stat.accent .n{color:var(--rose-d)}
.stat.warn .n{color:var(--warn)}

/* ---- revenue chart ---- */
.chartwrap{position:relative;width:100%}
.chartwrap svg{display:block;width:100%;height:auto;overflow:visible}
.chart-tip{position:absolute;pointer-events:none;opacity:0;transform:translate(-50%,-115%);transition:opacity .12s ease;
  background:var(--white);border:1px solid var(--line);border-radius:12px;padding:8px 11px;box-shadow:0 12px 32px rgba(150,90,110,.18);white-space:nowrap;z-index:4}
.chart-tip .t-d{font-size:11px;color:var(--ink2);margin-bottom:2px}
.chart-tip .t-v{font-size:15px;font-weight:700;font-family:'Fraunces',serif}
.chart-empty{display:flex;align-items:center;justify-content:center;height:190px;color:var(--ink2);font-size:13.5px;text-align:center;padding:0 20px}
.seg{display:inline-flex;background:var(--cream2);border:1px solid var(--line);border-radius:99px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:7px 15px;border-radius:99px;font:inherit;font-size:13px;color:var(--ink2);cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--rose-d);color:#fff;font-weight:600}
/* ---- custom date picker (fully NL/EN, never the browser locale) ---- */
.dpwrap{position:relative}
.dpwrap input{cursor:pointer}
.dp{position:absolute;z-index:30;top:calc(100% + 6px);left:0;width:290px;max-width:calc(100vw - 40px);background:var(--white);border:1px solid var(--line);
  border-radius:16px;box-shadow:0 18px 46px rgba(150,90,110,.22);padding:12px}
.dp-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.dp-h b{font-family:'Fraunces',serif;font-size:15px}
.dp-h button{border:1px solid var(--line);background:var(--cream);width:30px;height:30px;border-radius:9px;cursor:pointer;font-size:15px;line-height:1;color:var(--ink)}
.dp-g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.dp-g .dh{font-size:10.5px;color:var(--ink2);text-align:center;padding:4px 0;font-weight:700;text-transform:uppercase}
.dp-g button{border:0;background:transparent;padding:8px 0;border-radius:9px;cursor:pointer;font:inherit;font-size:13px;color:var(--ink)}
.dp-g button:hover{background:var(--cream2)}
.dp-g button.sel{background:var(--rose-d);color:#fff;font-weight:700}
.dp-g button.today{box-shadow:inset 0 0 0 1.5px var(--rose-d)}
.dp-g button.off{visibility:hidden}
.dp-f{display:flex;justify-content:space-between;gap:8px;margin-top:9px;border-top:1px solid var(--line);padding-top:9px}
.dp-f button{border:0;background:transparent;color:var(--rose-d);font:inherit;font-size:13px;font-weight:600;cursor:pointer;padding:5px 8px;border-radius:8px}
.dp-f button:hover{background:var(--cream2)}
/* ---- visitor map ---- */
.nlmap{position:relative;width:100%;max-width:430px;margin:0 auto}
.nlmap svg{display:block;width:100%;height:auto}
.nlmap svg .prov{fill:#F6E6EC;stroke:#E3BFCE;stroke-width:2;transition:fill .2s ease}
.nlmap svg .prov.hot{fill:#EFD2DE}
.mapgrid{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:26px;align-items:start}
@media(max-width:760px){.mapgrid{grid-template-columns:minmax(0,1fr);gap:16px}.nlmap{max-width:290px}}
.citylist{display:flex;flex-direction:column;gap:1px}
.cityrow{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line)}
.cityrow:last-child{border-bottom:0}
.cityrow .cn{font-weight:600;flex:1 1 auto;min-width:0;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cityrow .cb{flex:0 1 130px;height:8px;background:var(--cream2);border-radius:99px;overflow:hidden;min-width:40px}
.cityrow .cb i{display:block;height:100%;background:var(--rose-d);border-radius:99px}
.cityrow .cv{flex:0 0 auto;font-variant-numeric:tabular-nums;color:var(--ink2);font-size:13px;min-width:26px;text-align:right}

/* ---- panels + tables ---- */
.panel{background:var(--cream);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;margin-bottom:22px}
.panel .ph{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.panel .ph h3{font-size:15px;font-weight:600}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink2);font-weight:700;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--cream2)}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.clickable{cursor:pointer}
tr.clickable:hover td{background:var(--cream2)}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
.pill.lead{background:#EAF3FF;color:#3E7BC2}
.pill.active{background:#E7F6EE;color:var(--ok)}
.pill.klant{background:var(--rose-l);color:var(--rose-d)}
.pill.done{background:#EDE4E8;color:var(--ink2)}
.pill.new{background:#FFF3E0;color:var(--warn)}
.pill.win{background:#E7F6EE;color:var(--ok)}
.pill.no{background:#F3E9EC;color:var(--ink2)}
.muted{color:var(--ink2)}
.right{text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:11px;background:var(--cream2);border:1px solid var(--line);border-radius:99px;padding:2px 8px;color:var(--ink2)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.toolbar input{max-width:260px}
.toolbar select{max-width:190px}
.seg{display:inline-flex;background:var(--cream);border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{background:transparent;border:0;padding:7px 14px;font-size:13px;font-weight:600;color:var(--ink2)}
.seg button.on{background:var(--rose-d);color:#fff}
.empty{padding:40px 20px;text-align:center;color:var(--ink2);font-size:14px}

/* ---- modal ---- */
.overlay{position:fixed;inset:0;background:rgba(34,27,31,.5);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto}
.modal{width:100%;max-width:520px;background:var(--cream);border-radius:var(--r);box-shadow:0 30px 70px rgba(0,0,0,.3)}
.modal .mh{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.modal .mh h3{font-family:'Fraunces',serif;font-weight:600;font-size:19px}
.modal .mh .x{background:none;border:0;font-size:22px;color:var(--ink2);line-height:1}
.modal .mb{padding:20px 22px}
.modal .mf{padding:16px 22px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.note{background:var(--cream2);border:1px solid var(--line);border-radius:11px;padding:10px 12px;margin-bottom:8px;font-size:13px}
.note .meta{font-size:11px;color:var(--ink2);margin-top:4px}

/* ---- availability ---- */
.days{display:flex;flex-direction:column;gap:8px}
.dayrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:var(--cream)}
.dayrow .dn{width:96px;font-weight:600;font-size:14px}
.dayrow input[type=time]{width:120px}
.dayrow.off{opacity:.5}
.switch{position:relative;width:42px;height:24px;flex-shrink:0}
.switch input{opacity:0;width:0;height:0}
.switch .sl{position:absolute;inset:0;background:#DED2D8;border-radius:99px;transition:.2s}
.switch .sl:before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.switch input:checked+.sl{background:var(--rose-d)}
.switch input:checked+.sl:before{transform:translateX(18px)}

.langtog{display:inline-flex;border:1px solid var(--line);border-radius:99px;overflow:hidden;background:var(--cream)}
.langtog .langbtn{background:transparent;border:0;padding:4px 12px;font-size:12px;font-weight:700;color:var(--ink2);cursor:pointer}
.langtog .langbtn.on{background:var(--rose-d);color:#fff}
.calnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-dh{text-align:center;font-size:11px;font-weight:700;color:var(--ink2);padding:4px 0}
.cal-day{border:1px solid var(--line);border-radius:10px;padding:7px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;background:var(--cream);min-height:50px;transition:transform .1s}
.cal-day:hover{transform:translateY(-1px)}
.cal-day .cd{font-size:14px;font-weight:600}
.cal-day .ct{font-size:10px;color:var(--ink2)}
.cal-day.open{background:#E7F6EE;border-color:#c9ebd7}
.cal-day.open .ct{color:var(--ok)}
.cal-day.closed{background:var(--cream2);opacity:.75}
.cal-day.custom{box-shadow:inset 0 0 0 2px var(--rose-d)}
.cal-day.past{opacity:.4;pointer-events:none}
.slotrow{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.slotrow input[type=time]{flex:1;min-width:0}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;
padding:11px 20px;border-radius:99px;font-size:14px;font-weight:500;opacity:0;transition:.28s;z-index:200;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.25)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.err{background:var(--bad)}

@media(max-width:760px){
  .side{position:fixed;left:0;top:0;z-index:60;transform:translateX(-100%);transition:transform .25s;box-shadow:0 0 40px rgba(0,0,0,.2)}
  .side.open{transform:translateX(0)}
  .main{padding:18px 16px 60px}
  .mobile-bar{display:flex!important}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:55}
}
.mobile-bar{display:none;align-items:center;gap:12px;margin-bottom:18px}
.mobile-bar button{background:var(--cream);border:1px solid var(--line);border-radius:11px;width:42px;height:42px;font-size:19px}
.mobile-bar b{font-family:'Fraunces',serif;font-size:18px}

/* ============ MOBILE-APP POLISH (phones) ============ */
@media(max-width:640px){
  input,select,textarea{font-size:16px}            /* stop iOS zoom-on-focus */
  .main{padding:16px 13px 88px}
  .topbar h2{font-size:23px}
  .toolbar{flex-wrap:wrap;gap:10px}
  .toolbar input,.toolbar select{max-width:none;width:100%}
  .btn.sm{padding:12px 18px;font-size:14px}
  .btn.tiny{padding:9px 14px;font-size:13px}
  .seg,.langtog{width:100%}
  /* --- tables become stacked cards --- */
  .panel{border:0;background:transparent;box-shadow:none;overflow:visible;margin-bottom:12px}
  .panel .ph{padding:2px 2px 10px;border:0;background:transparent}
  .tablewrap{overflow:visible}
  table{font-size:14px}
  table thead{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  table,tbody{display:block;width:100%}
  tbody tr{display:block;background:var(--cream);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);margin:0 0 12px;padding:4px 4px}
  tbody td{display:flex;justify-content:space-between;align-items:center;gap:14px;border:0;border-bottom:1px solid var(--line);padding:11px 15px;text-align:right}
  tbody tr td:last-child{border-bottom:0}
  tbody td::before{content:attr(data-label);font-weight:700;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink2);text-align:left;flex:0 0 auto}
  tbody td[data-label=""]::before,tbody td:not([data-label])::before{display:none}
  tbody td[data-label=""]{justify-content:flex-end;flex-wrap:wrap;gap:7px;padding-top:12px}
  tbody td.right{justify-content:space-between}
  tr.clickable{cursor:pointer}
  tr.clickable:active{transform:scale(.995)}
  /* compact list: only the kept cells show, tap the row for the full record */
  table.tbl-compact tbody tr{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 16px}
  table.tbl-compact tbody tr::after{content:"›";color:var(--rose-d);font-size:22px;line-height:1;flex:0 0 auto;opacity:.7}
  table.tbl-compact tbody td{display:none}
  table.tbl-compact tbody td.m-keep{display:block;border:0;padding:0;text-align:left;min-width:0}
  table.tbl-compact tbody td.m-keep::before{display:none}
  table.tbl-compact tbody td.m-name{flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  table.tbl-compact tbody td.m-status{flex:0 0 auto}
  table.tbl-compact tbody td.m-name .chips{display:none}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
  .stat{padding:14px 15px}
  .stat .n.money{font-size:20px}
  .cityrow .cn{min-width:86px;font-size:14px}
  .empty{padding:26px 16px}
  /* --- modals slide up as bottom sheets --- */
  .overlay{padding:0;align-items:flex-end}
  .modal{max-width:100%;width:100%;border-radius:22px 22px 0 0;max-height:94vh;display:flex;flex-direction:column;animation:sheetUp .28s cubic-bezier(.2,.8,.2,1)}
  .modal .mb{overflow-y:auto;-webkit-overflow-scrolling:touch}
  .modal .mf{position:sticky;bottom:0;background:var(--cream);flex-wrap:wrap;gap:8px}
  .modal .mf .btn{flex:1 1 auto;min-width:130px;width:auto}
  @keyframes sheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
  /* --- calendar + day rows touch-friendly --- */
  .cal-day{min-height:56px}
  .dayrow{flex-wrap:wrap;gap:9px 10px}
  .dayrow .dn{flex:1 1 auto;width:auto;min-width:64px}
  .dayrow .av-start,.dayrow .av-end{flex:1 1 38%;min-width:0;width:auto}
  .dayrow .av-save{flex:0 0 auto;margin-left:auto}
}
@media(max-width:640px) and (display-mode:standalone){ .main{padding-bottom:110px} }
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="login">
  <div class="card login-box">
    <div style="display:flex;justify-content:center;margin-bottom:10px"><div class="langtog"><button class="langbtn" data-l="nl">NL</button><button class="langbtn" data-l="en">EN</button></div></div>
    <img src="/logo.png" alt="Shaytye" onerror="this.style.display='none'">
    <h1>Dashboard</h1>
    <p id="login-sub">Log in met je e-mailadres</p>
    <div id="step-email">
      <div class="field"><label id="lbl-email">E-mailadres</label><input id="l-email" type="email" placeholder="jij@shaytye.com" autocomplete="email"></div>
      <button class="btn" id="l-send">Stuur inlogcode</button>
    </div>
    <div id="step-code" class="hide">
      <div class="field"><label id="lbl-code">Code uit je e-mail</label><input id="l-code" inputmode="numeric" maxlength="6" placeholder="6-cijferige code"></div>
      <button class="btn" id="l-verify">Inloggen</button>
      <button class="btn ghost" id="l-back" style="margin-top:8px">Ander e-mailadres</button>
    </div>
    <div class="msg" id="l-msg"></div>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app" class="hide">
  <aside class="side" id="side">
    <div class="brand"><img src="/logo.png" alt="Shaytye" onerror="this.parentNode.innerHTML='<b>Shaytye</b>'"></div>

function tr(x){ return (LANG==="en" && T[x]!==undefined) ? T[x] : x; }
function TL(html){
  if(LANG!=="en") return html;
  return html.replace(/>([^<>]+)</g, function(m, txt){
    var k=txt.trim();
    if(T[k]!==undefined){ return ">"+T[k]+"<"; }
    return m;
  });
}

  LANG=l; document.documentElement.lang=l;
  var bs=document.querySelectorAll(".langbtn");
  for(var i=0;i<bs.length;i++){ bs[i].className="langbtn"+(bs[i].getAttribute("data-l")===LANG?" on":""); }

function $(id){ return document.getElementById(id); }
function esc(s){ s = (s===null||s===undefined)?"":String(s);
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function toast(m,bad){ var t=$("toast"); t.textContent=m; t.className = bad?"show err":"show"; setTimeout(function(){t.className="";},2600); }
function fmtDate(s){ if(!s) return "-"; var d=new Date(s); return d.getDate()+" "+monthShort(d.getMonth())+" "+d.getFullYear(); }
function fmtDateTime(s){ if(!s) return "-"; var d=new Date(s); return d.getDate()+" "+monthShort(d.getMonth())+" "+("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2); }
function fmtTime(t){ return t?String(t).slice(0,5):""; }
function money(n){ return "\u20AC " + (Number(n||0)).toLocaleString("nl-NL",{minimumFractionDigits:2,maximumFractionDigits:2}); }
/* Amounts are typed the Dutch way: 135,50 as well as 135.50 both parse. */
function num(x){
  if(x===null||x===undefined) return 0;
  var s=String(x).trim().replace(/\s|\u20AC/g,"");
  if(!s) return 0;
  if(s.indexOf(",")>-1 && s.indexOf(".")>-1) s=s.replace(/\./g,"").replace(",",".");   /* 1.234,50 */
  else s=s.replace(",",".");
  var v=parseFloat(s);
  return isNaN(v)?0:v;
}
/* Show a number back in a field the way she typed it: comma decimals, no currency. */
function amt(n){
  if(n===null||n===undefined||n==="") return "";
  return String(n).replace(".",",");
}

async function api(action, payload){
  var body = Object.assign({ action:action, token:TOKEN }, payload||{});
  var r = await fetch(API, {
    method:"POST",
    headers:{ "Authorization":"Bearer "+KEY, "apikey":KEY, "content-type":"application/json", "x-admin-token":TOKEN },
    body: JSON.stringify(body)
  });
  var data = await r.json().catch(function(){ return {error:"parse"}; });
  if(r.status===401 && action!=="request_code" && action!=="verify_code"){ doLogout(true); throw new Error("unauthorized"); }
  if(data.error){ throw new Error(data.detail || data.error); }
  return data;
}

/* ---------------- LOGIN ---------------- */
function lmsg(m,cls){ var e=$("l-msg"); e.textContent=m||""; e.className="msg "+(cls||""); }
$("l-send").onclick = async function(){
  var email = $("l-email").value.trim();
  if(!email){ lmsg(tr("Vul je e-mailadres in."),"err"); return; }
  this.disabled=true; lmsg(tr("Bezig..."));
  try{
    await api("request_code", { email:email });
    window._loginEmail = email;
    $("step-email").classList.add("hide"); $("step-code").classList.remove("hide");
    lmsg(tr("Als dit adres bekend is, is er een code verstuurd."),"ok");
    $("l-code").focus();
  }catch(e){ lmsg(tr("Er ging iets mis. Probeer opnieuw."),"err"); }
  this.disabled=false;
};
$("l-back").onclick = function(){ $("step-code").classList.add("hide"); $("step-email").classList.remove("hide"); lmsg(""); };
$("l-verify").onclick = async function(){
  var code = $("l-code").value.trim();
  if(!/^\d{6}$/.test(code)){ lmsg(tr("Voer de 6-cijferige code in."),"err"); return; }
  this.disabled=true; lmsg(tr("Controleren..."));
  try{
    var d = await api("verify_code", { email:window._loginEmail, code:code });
    TOKEN = d.token; EMAIL = d.email;
    try{ sessionStorage.setItem("shaytye_tok",TOKEN); sessionStorage.setItem("shaytye_email",EMAIL); }catch(e){}
    startApp();
  }catch(e){ lmsg(tr("Onjuiste of verlopen code."),"err"); this.disabled=false; }
};
$("l-code").addEventListener("keydown",function(e){ if(e.key==="Enter") $("l-verify").click(); });
$("l-email").addEventListener("keydown",function(e){ if(e.key==="Enter") $("l-send").click(); });

function doLogout(silent){
  try{ if(TOKEN) api("logout",{}); }catch(e){}
  try{ sessionStorage.removeItem("shaytye_tok"); sessionStorage.removeItem("shaytye_email"); }catch(e){}
  TOKEN=""; EMAIL="";
  $("app").classList.add("hide"); $("login").classList.remove("hide");
  $("step-code").classList.add("hide"); $("step-email").classList.remove("hide");
  $("l-code").value=""; if(!silent) lmsg("");
}
$("logout").onclick = function(){ doLogout(); };

function renderNav(){

    var badge = (t.id==="game" && STATE.stats && STATE.stats.unclaimed) ? "<span class='badge'>"+STATE.stats.unclaimed+"</span>" :
                (t.id==="bookings" && STATE.stats && STATE.stats.bookingsNew) ? "<span class='badge'>"+STATE.stats.bookingsNew+"</span>" : "";

  }

  for(var j=0;j<btns.length;j++){ btns[j].onclick=function(){ go(this.getAttribute("data-tab")); closeSide(); }; }

async function startApp(){
  $("login").classList.add("hide"); $("app").classList.remove("hide");
  $("who").textContent = EMAIL;
  renderNav();
  await loadStats();

}
async function loadStats(){ try{ var d=await api("overview",{}); STATE.stats=d.stats; STATE.overview=d; renderNav(); }catch(e){} }

function render(){

  if(STATE.tab==="game") return renderGame(v);
  if(STATE.tab==="clients") return renderClients(v);
  if(STATE.tab==="bookings") return renderBookings(v);
  if(STATE.tab==="receipts") return renderPayments(v);
  if(STATE.tab==="income") return renderIncome(v);
  if(STATE.tab==="reviews") return renderReviews(v);
  if(STATE.tab==="analytics") return renderAnalytics(v);
  if(STATE.tab==="availability") return renderAvailability(v);
  if(STATE.tab==="settings") return renderSettings(v);
}

async function renderOverview(v){

  STATE.overview=d; STATE.stats=d.stats;
  var s=d.stats;
  var cards=[
    ["accent",s.clients,"Cliënten"],["",s.leads,"Leads"],
    ["",s.entries,"Spel-inzendingen"],["accent",s.winners,"Winnaars"],
    ["warn",s.unclaimed,"Prijs niet geclaimd"],["warn",s.unredeemed,"Niet verzilverd"],
    ["",s.bookingsUpcoming,"Komende boekingen"],["accent",money(s.revenue),"Omzet"]
  ];
  var h="<div class='stats'>";
  for(var i=0;i<cards.length;i++){ h+="<div class='stat "+cards[i][0]+"'><div class='n'>"+esc(cards[i][1])+"</div><div class='l'>"+cards[i][2]+"</div></div>"; }

  h+="<div class='panel'><div class='ph'><h3>Laatste spel-inzendingen</h3></div><div class='tablewrap'>";

    h+="<table><thead><tr><th>Naam</th><th>Telefoon</th><th>Resultaat</th><th>Wanneer</th></tr></thead><tbody>";
    d.recentEntries.forEach(function(e){
      h+="<tr><td>"+esc(e.first_name)+"</td><td class='muted'>"+esc(e.phone)+"</td><td>"+(e.won?"<span class='pill win'>"+esc(e.prize_label)+"</span>":"<span class='pill no'>Geen prijs</span>")+"</td><td class='muted'>"+fmtDateTime(e.created_at)+"</td></tr>";
    });
    h+="</tbody></table>";
  } else { h+="<div class='empty'>Nog geen inzendingen.</div>"; }
  h+="</div></div>";
  // recent bookings
  h+="<div class='panel'><div class='ph'><h3>Laatste boekingen</h3></div><div class='tablewrap'>";
  if((d.recentBookings||[]).length){
    h+="<table><thead><tr><th>Cliënt</th><th>Datum</th><th>Dienst</th><th>Status</th></tr></thead><tbody>";
    d.recentBookings.forEach(function(b){
      h+="<tr><td>"+esc(b.client_name)+"</td><td>"+fmtDate(b.day)+" "+fmtTime(b.start_time)+"</td><td class='muted'>"+esc(b.service||"-")+"</td><td>"+statusPill(b.status)+"</td></tr>";
    });
    h+="</tbody></table>";
  } else { h+="<div class='empty'>Nog geen boekingen.</div>"; }
  h+="</div></div>";
  v.innerHTML = TL(head("Overzicht","Een blik op je bedrijf")+h);
}

/* ---------------- shared date helpers (fully NL/EN, never the browser locale) ---------------- */
var MONTHS_NL=["januari","februari","maart","april","mei","juni","juli","augustus","september","oktober","november","december"];
var MONTHS_EN=["January","February","March","April","May","June","July","August","September","October","November","December"];
var MONTHS_SH_NL=["jan","feb","mrt","apr","mei","jun","jul","aug","sep","okt","nov","dec"];
var MONTHS_SH_EN=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
var DOW_NL=["ma","di","wo","do","vr","za","zo"];
var DOW_EN=["Mo","Tu","We","Th","Fr","Sa","Su"];
function monthName(i){ return (LANG==="en"?MONTHS_EN:MONTHS_NL)[i]; }
function monthShort(i){ return (LANG==="en"?MONTHS_SH_EN:MONTHS_SH_NL)[i]; }
function isoToday(){ var d=new Date(); return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2); }
function isoParts(iso){ var p=String(iso).split("-"); return {y:Number(p[0]), m:Number(p[1])-1, d:Number(p[2])}; }
function isoDate(iso){ var p=isoParts(iso); return new Date(p.y,p.m,p.d); }
/* long, human date in the active language — never falls back to the browser locale */
function dateLong(iso){
  if(!iso) return "-";
  var p=isoParts(iso);
  return LANG==="en" ? (monthName(p.m)+" "+p.d+", "+p.y) : (p.d+" "+monthName(p.m)+" "+p.y);
}
function dateShort(iso){ var p=isoParts(iso); return p.d+" "+monthShort(p.m); }

/* A small calendar popover. Replaces <input type=date> so the month and day
   names always follow the admin language instead of the browser's. */
function makeDatePicker(wrapId, iso, onPick){
  var wrap=$(wrapId); if(!wrap) return;
  var input=wrap.querySelector("input");
  var value=iso||isoToday();
  var view=isoDate(value); view.setDate(1);
  input.value=dateLong(value);
  input.setAttribute("readonly","readonly");
  wrap.getValue=function(){ return value; };
  wrap.setValue=function(v){ value=v; input.value=dateLong(v); view=isoDate(v); view.setDate(1); };
  var pop=null;
  function close(){ if(pop){ pop.remove(); pop=null; document.removeEventListener("mousedown",outside,true); } }
  function outside(e){ if(pop && !wrap.contains(e.target)) close(); }
  function draw(){
    var y=view.getFullYear(), m=view.getMonth();
    var h="<div class='dp-h'><button type='button' data-dp='prev' aria-label='"+tr("Vorige maand")+"'>&lsaquo;</button>"+
          "<b>"+monthName(m)+" "+y+"</b>"+
          "<button type='button' data-dp='next' aria-label='"+tr("Volgende maand")+"'>&rsaquo;</button></div><div class='dp-g'>";
    var dow=(LANG==="en"?DOW_EN:DOW_NL);
    for(var i=0;i<7;i++) h+="<div class='dh'>"+dow[i]+"</div>";
    var first=new Date(y,m,1), offset=(first.getDay()+6)%7;
    for(var b=0;b<offset;b++) h+="<button type='button' class='off'></button>";
    var dim=new Date(y,m+1,0).getDate(), today=isoToday();
    for(var d=1;d<=dim;d++){
      var cell=y+"-"+("0"+(m+1)).slice(-2)+"-"+("0"+d).slice(-2);
      h+="<button type='button' data-day='"+cell+"' class='"+(cell===value?"sel":"")+(cell===today?" today":"")+"'>"+d+"</button>";
    }
    h+="</div><div class='dp-f'><button type='button' data-dp='today'>"+tr("Vandaag")+"</button>"+
       "<button type='button' data-dp='close'>"+tr("Sluiten")+"</button></div>";
    pop.innerHTML=h;
    pop.querySelectorAll("[data-day]").forEach(function(b){ b.onclick=function(){
      value=this.getAttribute("data-day"); input.value=dateLong(value); close(); if(onPick) onPick(value);
    };});
    pop.querySelector("[data-dp='prev']").onclick=function(){ view=new Date(y,m-1,1); draw(); };
    pop.querySelector("[data-dp='next']").onclick=function(){ view=new Date(y,m+1,1); draw(); };
    pop.querySelector("[data-dp='today']").onclick=function(){ value=isoToday(); input.value=dateLong(value); close(); if(onPick) onPick(value); };
    pop.querySelector("[data-dp='close']").onclick=close;
  }
  input.onclick=function(){
    if(pop){ close(); return; }
    pop=document.createElement("div"); pop.className="dp"; wrap.appendChild(pop);
    view=isoDate(value); view.setDate(1); draw();
    document.addEventListener("mousedown",outside,true);
  };
}

/* ---------------- GROSS INCOME (Omzet) ---------------- */
function weekKey(iso){
  var p=isoParts(iso), d=new Date(p.y,p.m,p.d);
  var dn=(d.getDay()+6)%7; d.setDate(d.getDate()-dn+3);            /* ISO: Thursday of that week */
  var firstThu=new Date(d.getFullYear(),0,4);
  var fdn=(firstThu.getDay()+6)%7; firstThu.setDate(firstThu.getDate()-fdn+3);
  var wk=1+Math.round((d-firstThu)/(7*864e5));
  return d.getFullYear()+"-W"+("0"+wk).slice(-2);
}
function sumBy(rows, keyFn){
  var out={}; rows.forEach(function(r){ var k=keyFn(r.day); out[k]=(out[k]||0)+r.amount; }); return out;
}
function shiftIso(iso, days){ var d=isoDate(iso); d.setDate(d.getDate()+days); return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2); }
function pctChange(cur, prev){
  if(!prev) return cur>0 ? {txt:"+100%", cls:"up"} : {txt:"0%", cls:"flat"};
  var p=Math.round((cur-prev)/prev*1000)/10;
  return { txt:(p>0?"+":"")+p+"%", cls: p>0?"up":(p<0?"dn":"flat") };
}
/* Short, unambiguous axis labels: 0, 500, 1,5k, 2k ... (never two identical ticks) */
function axisMoney(v){
  if(v>=1000){
    var k=v/1000, s=(Math.round(k*10)/10).toString().replace(".",",");
    return "\u20AC"+s+"k";
  }
  return "\u20AC"+Math.round(v);
}
/* Area chart with gradient fill, dotted grid, hover tooltip and highlighted peak. */
function revenueChart(series, opts){
  opts=opts||{};
  var W=1000, H=300, PL=62, PR=16, PT=22, PB=38;
  if(!series.length) return "<div class='chart-empty'>"+tr("Nog geen omzet ingevoerd — voeg hieronder je eerste bedrag toe.")+"</div>";
  var vals=series.map(function(s){return s.v;});
  var maxV=Math.max.apply(null,vals), minV=0;
  if(maxV<=0) maxV=1;
  /* round the top of the axis to a friendly number so the ticks read cleanly */
  function niceStep(x){
    if(x<=0) return 1;
    var e=Math.pow(10,Math.floor(Math.log(x)/Math.LN10)), f=x/e;
    return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*e;
  }
  var step4=niceStep(maxV/4), niceMax=step4*4;
  if(niceMax<maxV) niceMax=Math.ceil(maxV/step4)*step4;
  var iw=W-PL-PR, ih=H-PT-PB;
  var n=series.length;
  function X(i){ return n===1 ? PL+iw/2 : PL+(i/(n-1))*iw; }
  function Y(v){ return PT+ih-((v-minV)/(niceMax-minV))*ih; }
  var pts=series.map(function(s,i){ return [X(i),Y(s.v)]; });
  /* smooth path through the points */
  function curve(p){
    if(p.length<2) return "M"+p[0][0]+" "+p[0][1];
    var d="M"+p[0][0].toFixed(1)+" "+p[0][1].toFixed(1);
    for(var i=0;i<p.length-1;i++){
      var x0=p[i][0], y0=p[i][1], x1=p[i+1][0], y1=p[i+1][1], mx=(x0+x1)/2;
      d+="C"+mx.toFixed(1)+" "+y0.toFixed(1)+","+mx.toFixed(1)+" "+y1.toFixed(1)+","+x1.toFixed(1)+" "+y1.toFixed(1);
    }
    return d;
  }
  var line=curve(pts);
  var area=line+"L"+pts[pts.length-1][0].toFixed(1)+" "+(PT+ih)+"L"+pts[0][0].toFixed(1)+" "+(PT+ih)+"Z";
  var peakI=0; for(var i=1;i<n;i++){ if(series[i].v>series[peakI].v) peakI=i; }
  var uid="rc"+Math.floor(Math.random()*1e6);
  var s="<svg viewBox='0 0 "+W+" "+H+"' role='img'>";
  s+="<defs><linearGradient id='"+uid+"g' x1='0' y1='0' x2='0' y2='1'>"+
     "<stop offset='0%' stop-color='#C47592' stop-opacity='.30'/><stop offset='100%' stop-color='#C47592' stop-opacity='0'/></linearGradient>"+
     "<pattern id='"+uid+"d' x='0' y='0' width='22' height='22' patternUnits='userSpaceOnUse'><circle cx='11' cy='11' r='1.1' fill='#E3BFCE' fill-opacity='.55'/></pattern></defs>";
  s+="<rect x='"+PL+"' y='"+PT+"' width='"+iw+"' height='"+ih+"' fill='url(#"+uid+"d)'/>";
  /* horizontal grid + € axis */
  for(var g=0;g<=4;g++){
    var gv=niceMax/4*g, gy=Y(gv);
    s+="<line x1='"+PL+"' y1='"+gy.toFixed(1)+"' x2='"+(W-PR)+"' y2='"+gy.toFixed(1)+"' stroke='#EBD5DE' stroke-width='1' stroke-dasharray='4 8'/>";
    s+="<text x='"+(PL-9)+"' y='"+(gy+4).toFixed(1)+"' text-anchor='end' font-size='13' fill='#A99CA2'>"+axisMoney(gv)+"</text>";
  }
  s+="<path d='"+area+"' fill='url(#"+uid+"g)'/>";
  s+="<path d='"+line+"' fill='none' stroke='#C47592' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/>";
  /* peak marker */
  if(series[peakI].v>0){
    s+="<line x1='"+X(peakI).toFixed(1)+"' y1='"+PT+"' x2='"+X(peakI).toFixed(1)+"' y2='"+(PT+ih)+"' stroke='#C47592' stroke-dasharray='4 4' stroke-width='1' opacity='.55'/>";
    s+="<circle cx='"+X(peakI).toFixed(1)+"' cy='"+Y(series[peakI].v).toFixed(1)+"' r='6' fill='#C47592' stroke='#fff' stroke-width='2.5'/>";
  }
  /* x labels: at most 6, evenly spread */
  var step=Math.max(1,Math.ceil(n/6));
  for(var k=0;k<n;k+=step){
    s+="<text x='"+X(k).toFixed(1)+"' y='"+(H-12)+"' text-anchor='middle' font-size='13' fill='#A99CA2'>"+esc(series[k].label)+"</text>";
  }
  /* invisible hover targets */
  var bw=iw/Math.max(1,n);
  for(var j=0;j<n;j++){
    s+="<rect class='hot' data-i='"+j+"' x='"+(X(j)-bw/2).toFixed(1)+"' y='"+PT+"' width='"+bw.toFixed(1)+"' height='"+ih+"' fill='transparent' style='cursor:pointer'/>";
    s+="<circle class='hd' data-i='"+j+"' cx='"+X(j).toFixed(1)+"' cy='"+Y(series[j].v).toFixed(1)+"' r='5' fill='#C47592' stroke='#fff' stroke-width='2' opacity='0'/>";
  }
  s+="</svg><div class='chart-tip'></div>";
  return s;
}
function wireChart(box, series){
  if(!box) return;
  var svg=box.querySelector("svg"); if(!svg) return;
  var tip=box.querySelector(".chart-tip");
  box.querySelectorAll("rect.hot").forEach(function(r){
    function show(){
      var i=Number(r.getAttribute("data-i")), s=series[i];
      var dot=box.querySelector(".hd[data-i='"+i+"']");
      box.querySelectorAll(".hd").forEach(function(c){ c.setAttribute("opacity","0"); });
      if(dot) dot.setAttribute("opacity","1");
      var rect=svg.getBoundingClientRect(), br=box.getBoundingClientRect();
      var cx=dot ? dot.getBBox().x+dot.getBBox().width/2 : 0;

     "<div class='stat'><div class='n'>"+(d.total||0)+"</div><div class='l'>"+tr("Totaal ooit")+"</div></div></div>";
  /* ---- Netherlands map + city board, side by side on desktop ---- */

  else{
    h+="<div class='citylist'>";
    cityArr.slice(0,10).forEach(function(c){
      h+="<div class='cityrow'><span class='cn'>"+esc(c.name)+"</span><span class='cb'><i style='width:"+Math.max(4,Math.round(c.n/maxC*100))+"%'></i></span><span class='cv'>"+c.n+"</span></div>";
    });
    h+="</div>";
  }
  if(abroad){
    var ac=Object.keys(abroadCities).sort(function(a,b){return abroadCities[b]-abroadCities[a];}).slice(0,4)
             .map(function(k){ return esc(k)+" ("+abroadCities[k]+")"; }).join(", ");
    h+="<div class='muted' style='font-size:12.5px;margin-top:12px;padding-top:10px;border-top:1px solid var(--line)'>"+
       abroad+" "+tr("bezoeken van buiten Nederland")+(ac?" \u2014 "+ac:"")+"</div>";
  }
  h+="</div></div></div></div>";
  /* ---- daily bars ---- */
  var dayKeys=Object.keys(days).sort().slice(-14);
  if(dayKeys.length){
    var maxD=Math.max.apply(null,dayKeys.map(function(k){return days[k];}));
    h+="<div class='panel'><div class='ph'><h3>Bezoeken per dag</h3><span class='muted' style='font-size:12px'>"+tr("laatste 14 dagen")+"</span></div><div style='padding:16px 18px'>";
    h+="<div style='display:flex;align-items:flex-end;gap:6px;height:140px'>";
    dayKeys.forEach(function(k){
      var pct=Math.max(4,Math.round(days[k]/maxD*100));
      h+="<div style='flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0' title='"+dateLong(k)+": "+days[k]+"'>"+
         "<span style='font-size:11px;color:var(--ink2);margin-bottom:3px'>"+days[k]+"</span>"+

         "<span style='font-size:10px;color:var(--ink2);margin-top:4px;white-space:nowrap'>"+isoParts(k).d+"</span></div>";

      h+="<div class='cityrow'><span class='cn' style='min-width:130px'>"+esc(p.path==="/"?"/ (home)":p.path)+"</span>"+

      svg+="<path class='prov' d='"+NL_PATHS[name]+"'><title>"+esc(name)+"</title></path>";
    }

      var xy=nlProject(c.lat,c.lon);

           "<title>"+esc(c.name)+" · "+c.n+"</title></circle>";

           "<animate attributeName='r' values='"+r+";"+(r+26)+"' dur='2.6s' repeatCount='indefinite'/>"+
           "<animate attributeName='opacity' values='.6;0' dur='2.6s' repeatCount='indefinite'/></circle>"; }

/* ---------------- AVAILABILITY ---------------- */
var DAYNAMES=["Zondag","Maandag","Dinsdag","Woensdag","Donderdag","Vrijdag","Zaterdag"];
function isoLocal(dt){ return dt.getFullYear()+"-"+("0"+(dt.getMonth()+1)).slice(-2)+"-"+("0"+dt.getDate()).slice(-2); }
var AV={rules:[],exceptions:[],month:null};
function avByDate(iso){ for(var i=0;i<AV.exceptions.length;i++){ if(String(AV.exceptions[i].day).slice(0,10)===iso) return AV.exceptions[i]; } return null; }
function avRuleFor(wd){ for(var i=0;i<AV.rules.length;i++){ if(AV.rules[i].weekday===wd) return AV.rules[i]; } return null; }
function avExsForDate(iso){ return AV.exceptions.filter(function(x){ return String(x.day).slice(0,10)===iso; }); }
function avDayState(dt){
  var iso=isoLocal(dt); var exs=avExsForDate(iso);
  if(exs.length){
    if(exs.some(function(x){return x.kind==="closed";})) return {open:false,custom:true,windows:[],exs:exs};
    var w=exs.filter(function(x){return x.kind==="open";}).map(function(x){return {start:String(x.start_time||"09:00").slice(0,5),end:String(x.end_time||"17:00").slice(0,5)};}).sort(function(a,b){return a.start<b.start?-1:1;});
    return {open:w.length>0,custom:true,windows:w,exs:exs};
  }
  var r=avRuleFor(dt.getDay());
  if(r) return r.active?{open:true,custom:false,windows:[{start:String(r.start_time||"09:00").slice(0,5),end:String(r.end_time||"17:00").slice(0,5)}]}:{open:false,custom:false,windows:[]};
  return dt.getDay()!==0?{open:true,custom:false,windows:[{start:"09:00",end:"17:00"}]}:{open:false,custom:false,windows:[]};
}
async function renderAvailability(v){
  var d=await api("availability_get",{});
  AV.rules=d.rules||[]; AV.exceptions=d.exceptions||[];
  var now=new Date(); if(!AV.month) AV.month=new Date(now.getFullYear(),now.getMonth(),1);
  var byDay={}; AV.rules.forEach(function(r){ byDay[r.weekday]=r; });
  var h=head("Beschikbaarheid","Echte kalender per dag — deze week kan anders zijn dan volgende week");
  h+="<div class='panel'><div class='ph'><h3>Standaard week</h3></div><div style='padding:16px 18px'><div class='days'>";
  [1,2,3,4,5,6,0].forEach(function(wd){ var r=byDay[wd]||{}; var active=r.id?r.active:(wd!==0);
    h+="<div class='dayrow"+(active?"":" off")+"' data-wd='"+wd+"'"+(r.id?" data-id='"+r.id+"'":"")+">"+
      "<label class='switch'><input type='checkbox' class='av-on' "+(active?"checked":"")+"><span class='sl'></span></label>"+
      "<span class='dn'>"+DAYNAMES[wd]+"</span>"+
      "<input type='time' class='av-start' value='"+esc(r.start_time?String(r.start_time).slice(0,5):"09:00")+"'>"+
      "<span class='muted'>tot</span><input type='time' class='av-end' value='"+esc(r.end_time?String(r.end_time).slice(0,5):"17:00")+"'>"+
      "<button class='btn tiny sm av-save'>Opslaan</button></div>";
  });
  h+="</div></div></div>";
  var y=AV.month.getFullYear(), m=AV.month.getMonth();
  var MN=null;
  h+="<div class='panel'><div class='ph'><h3>Kalender</h3></div><div style='padding:16px 18px'>";
  h+="<div class='calnav'><button class='btn tiny gray' id='cal-prev'>&lsaquo;</button><b>"+(monthName(m).charAt(0).toUpperCase()+monthName(m).slice(1))+" "+y+"</b><button class='btn tiny gray' id='cal-next'>&rsaquo;</button></div>";
  h+="<div class='calgrid'>";
  (LANG==="en"?DOW_EN:DOW_NL).forEach(function(dn){ h+="<div class='cal-dh'>"+dn+"</div>"; });
  var first=new Date(y,m,1), offset=(first.getDay()+6)%7;
  for(var bb=0;bb<offset;bb++) h+="<div></div>";
  var dim=new Date(y,m+1,0).getDate(); var today=new Date(); today.setHours(0,0,0,0);
  for(var day=1;day<=dim;day++){ var dt=new Date(y,m,day); var st=avDayState(dt); var iso=isoLocal(dt);
    var cls="cal-day"+(st.open?" open":" closed")+(st.custom?" custom":"")+(dt<today?" past":"");
    var lbl=st.open?(st.windows[0].start+"-"+st.windows[0].end+(st.windows.length>1?(" +"+(st.windows.length-1)):"")):"—";
    h+="<button class='"+cls+"' data-cal='"+iso+"'><span class='cd'>"+day+"</span><span class='ct'>"+lbl+"</span></button>";
  }
  h+="</div><div class='muted' style='font-size:12px;margin-top:10px'>Groen = beschikbaar, grijs = gesloten. Roze rand = handmatig aangepast. Klik een dag om aan te passen.</div>";
  h+="</div></div>";
  v.innerHTML=TL(h);
  v.querySelectorAll(".dayrow").forEach(function(row){ var cb=row.querySelector(".av-on"); cb.onchange=function(){ row.classList.toggle("off",!this.checked); };
    row.querySelector(".av-save").onclick=async function(){
      var st=row.querySelector(".av-start").value, en=row.querySelector(".av-end").value;
      if(cb.checked && st && en && en<=st){ toast(tr("Eindtijd moet na de starttijd liggen"),1); return; }
      var payload={ weekday:Number(row.getAttribute("data-wd")), start_time:st, end_time:en, active:cb.checked };
      this.disabled=true;
      try{
        await api("availability_rule_set",payload);
        toast(tr("Opgeslagen — direct zichtbaar op de website"));
        renderAvailability(v);
      }catch(e){ toast(tr("Fout")+": "+e.message,1); this.disabled=false; }
    }; });
  $("cal-prev").onclick=function(){ AV.month=new Date(y,m-1,1); renderAvailability(v); };
  $("cal-next").onclick=function(){ AV.month=new Date(y,m+1,1); renderAvailability(v); };
  v.querySelectorAll("[data-cal]").forEach(function(x){ x.onclick=function(){ dayModal(this.getAttribute("data-cal"), v); }; });
}
function dayModal(iso, v){
  var p=iso.split("-"); var dt=new Date(Number(p[0]),Number(p[1])-1,Number(p[2])); var st=avDayState(dt);
  var mon=["jan","feb","mrt","apr","mei","jun","jul","aug","sep","okt","nov","dec"];
  var slots=(st.open&&st.windows.length)?st.windows.slice():[{start:"09:00",end:"17:00"}];
  var closed=st.custom&&!st.open;
  function slotRowHtml(w){ return "<div class='slotrow'><input type='time' class='sl-start' value='"+w.start+"'><span class='muted'>tot</span><input type='time' class='sl-end' value='"+w.end+"'><button type='button' class='btn tiny danger sl-del'>&times;</button></div>"; }
  var body="<p class='muted' style='font-size:13px;margin-bottom:14px'>"+DAYNAMES[dt.getDay()]+" "+dt.getDate()+" "+mon[dt.getMonth()]+" "+dt.getFullYear()+"</p>"+
    "<div class='field'><label>Status</label><select id='dm-kind'><option value='open'"+(!closed?" selected":"")+">Open</option><option value='closed'"+(closed?" selected":"")+">Gesloten</option></select></div>"+
    "<div id='dm-slots'"+(closed?" style='display:none'":"")+"><label style='display:block;font-size:12px;font-weight:600;color:var(--ink2);margin-bottom:6px'>Tijdslots</label><div id='dm-list'>"+slots.map(slotRowHtml).join("")+"</div><button type='button' class='btn tiny gray' id='dm-add' style='margin-top:6px'>+ Tijdslot toevoegen</button></div>";
  var foot=(st.custom?"<button class='btn gray sm' id='dm-default'>Terug naar standaard</button>":"")+"<button class='btn gray sm' id='dm-cancel'>Annuleren</button><button class='btn sm' id='dm-save'>Opslaan</button>";
  modal("Dag aanpassen", body, foot);
  function wireDel(){ $("dm-list").querySelectorAll(".sl-del").forEach(function(b){ b.onclick=function(){ if($("dm-list").children.length>1) this.parentNode.remove(); }; }); }
  wireDel();
  function tog(){ $("dm-slots").style.display=($("dm-kind").value==="open"?"block":"none"); } tog();
  $("dm-kind").onchange=tog;
  $("dm-add").onclick=function(){ var t=document.createElement("div"); t.innerHTML=slotRowHtml({start:"09:00",end:"17:00"}); $("dm-list").appendChild(t.firstChild); wireDel(); };
  $("dm-cancel").onclick=closeModal;
  async function clearDay(){ if(st.exs){ for(var i=0;i<st.exs.length;i++){ await api("availability_exception_delete",{id:st.exs[i].id}); } } }
  if($("dm-default")) $("dm-default").onclick=async function(){ try{ await clearDay(); closeModal(); toast(tr("Opgeslagen")); renderAvailability(v); }catch(e){ toast(tr("Fout"),1);} };
  $("dm-save").onclick=async function(){ this.disabled=true;
    try{ await clearDay();
      if($("dm-kind").value==="closed"){ await api("availability_exception_add",{day:iso,kind:"closed"}); }
      else { var rows=$("dm-list").querySelectorAll(".slotrow"); for(var i=0;i<rows.length;i++){ await api("availability_exception_add",{day:iso,kind:"open",start_time:rows[i].querySelector(".sl-start").value,end_time:rows[i].querySelector(".sl-end").value}); } }
      closeModal(); toast(tr("Opgeslagen")); renderAvailability(v);
    }catch(e){ toast(tr("Fout"),1); this.disabled=false; }
  };
}

/* ---------------- SETTINGS ---------------- */
async function renderSettings(v){
  var d=await api("settings_get",{});
  var c=d.settings.contest||{active:true,ends:"2026-08-31",max_per_person:2};
  var w=d.settings.prize_weights||{EUR5:13,EUR25:4,HOUR:3,NONE:60,AGAIN:20};
  var h=head("Instellingen","Het spel en algemene instellingen");
  h+="<div class='panel'><div class='ph'><h3>Rad van fortuin</h3></div><div style='padding:18px'>"+
    "<div class='dayrow' style='border:0;padding:0;margin-bottom:14px'><label class='switch'><input type='checkbox' id='s-active' "+(c.active?"checked":"")+"><span class='sl'></span></label><span class='dn' style='width:auto'>Spel actief</span></div>"+
    "<div class='grid2'><div class='field'><label>Einddatum</label><input type='text' id='s-ends' inputmode='numeric' placeholder='JJJJ-MM-DD' value='"+esc(c.ends||"")+"'></div>"+
    "<div class='field'><label>Max. per persoon</label><input type='number' id='s-max' value='"+esc(c.max_per_person||2)+"'></div></div>"+
    "<div class='muted' style='font-size:12px;margin-top:4px'>Wijzigingen worden automatisch opgeslagen.</div></div></div>";
  h+="<div class='panel'><div class='ph'><h3>Prijskansen (gewichten)</h3></div><div style='padding:18px'>"+
    "<p class='muted' style='font-size:13px;margin-bottom:14px'>Hoe hoger het getal, hoe groter de kans. NONE = geen prijs, AGAIN = extra draai.</p>"+
    "<div class='grid2'>"+
    ["EUR5","EUR25","HOUR","NONE","AGAIN"].map(function(k){ return "<div class='field'><label>"+k+"</label><input type='number' id='w-"+k+"' value='"+esc(w[k]!==undefined?w[k]:0)+"'></div>"; }).join("")+
    "</div><div class='muted' style='font-size:12px;margin-top:8px'>Wijzigingen worden automatisch opgeslagen.</div></div></div>";
  v.innerHTML=TL(h);
  function saveContest(){ api("settings_set",{key:"contest",value:{active:$("s-active").checked, ends:$("s-ends").value, max_per_person:Number($("s-max").value)||2}}).then(function(){ toast(tr("Opgeslagen")); }).catch(function(){ toast(tr("Fout"),1); }); }
  function saveWeights(){ var val={}; ["EUR5","EUR25","HOUR","NONE","AGAIN"].forEach(function(k){ val[k]=Number($("w-"+k).value)||0; }); api("settings_set",{key:"prize_weights",value:val}).then(function(){ toast(tr("Opgeslagen")); }).catch(function(){ toast(tr("Fout"),1); }); }
  ["s-active","s-ends","s-max"].forEach(function(id){ $(id).onchange=saveContest; });
  ["EUR5","EUR25","HOUR","NONE","AGAIN"].forEach(function(k){ $("w-"+k).onchange=saveWeights; });
}

/* ---------------- helpers ---------------- */
function head(title,sub){ return "<div class='topbar'><div><h2>"+title+"</h2><div class='sub'>"+sub+"</div></div></div>"; }
function statusPill(s){ s=s||"lead"; var m={lead:"lead",actief:"active",klant:"klant",afgerond:"done",inactief:"done",
  "new":"new",confirmed:"active",done:"done",cancelled:"done"};
  var labels={"new":"nieuw",confirmed:"bevestigd",done:"afgerond",cancelled:"geannuleerd"};
  return "<span class='pill "+(m[s]||"done")+"'>"+(labels[s]||s)+"</span>"; }
function boolTag(b){ return b?"<span class='pill active'>ja</span>":"<span class='pill no'>nee</span>"; }
function modal(title,body,foot){
  var o=document.createElement("div"); o.className="overlay"; o.id="overlay";
  o.innerHTML=TL("<div class='modal'><div class='mh'><h3>"+title+"</h3><button class='x' onclick='closeModal()'>&times;</button></div><div class='mb'>"+body+"</div><div class='mf'>"+foot+"</div></div>");
  o.onclick=function(e){ if(e.target===o) closeModal(); };
  document.body.appendChild(o);
}
function closeModal(){ var o=$("overlay"); if(o) o.remove(); }

/* ---------------- language toggle wiring ---------------- */
document.querySelectorAll(".langbtn").forEach(function(b){ b.onclick=function(){ setLang(this.getAttribute("data-l")); }; });

/* ---- responsive: label every table cell so it becomes a card on mobile ---- */
function decorateTables(root){
  (root||document).querySelectorAll("table").forEach(function(t){
    var ths=[].slice.call(t.querySelectorAll("thead th")).map(function(x){ return x.textContent.trim(); });
    if(!ths.length) return;
    t.querySelectorAll("tbody tr").forEach(function(tr){
      [].slice.call(tr.children).forEach(function(td,i){
        if(ths[i]!==undefined && !td.hasAttribute("data-label")) td.setAttribute("data-label", ths[i]);
      });
    });
  });
}
(function(){
  var vw=document.getElementById("view");
  if(!vw||!window.MutationObserver) return;
  new MutationObserver(function(){ decorateTables(vw); }).observe(vw,{childList:true,subtree:true});
})();
setLang(LANG);

(async function(){
  /* wipe any legacy localStorage from older builds — this app uses 0 localStorage */

    $("login").classList.add("hide");
    try{ await api("me",{}); startApp(); }
    catch(e){ doLogout(true); }
  }
})();
